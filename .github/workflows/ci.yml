name: Bridge CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test-bridge:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install system dependencies (Xvfb)
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Install Playwright Browsers
      run: |
        playwright install --with-deps chromium

    - name: Start FastAPI Bridge Server (Xvfb)
      env:
        MERLIN_AUTH_STATE: ${{ secrets.MERLIN_AUTH_STATE }}
      run: |
        xvfb-run -a uvicorn server:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
        
    - name: Wait for Server Boot
      run: |
        echo "Waiting for FastAPI server to boot on port 8000..."
        for i in {1..30}; do
          if curl -s http://127.0.0.1:8000/v1/models > /dev/null; then
            echo "FastAPI server is UP!"
            exit 0
          fi
          sleep 1
        done
        echo "Error: FastAPI server failed to start."
        cat server.log
        exit 1

    - name: Run Integration Tests
      run: |
        python test_bridge.py
